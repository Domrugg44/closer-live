name = "closer-data"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The D1 database. After `npx wrangler d1 create closer-data`, paste the id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "closer-data"
database_id = "4bf93db3-ecb2-49fc-8b23-3e1bcd64c9af"
migrations_dir = "migrations"

# Every 30 minutes: games + odds snapshot when due. 10:15 UTC daily: re-check recent final scores.
[triggers]
crons = ["*/30 * * * *", "15 10 * * *"]

# Public settings (not secrets). API keys are added with `npx wrangler secret put ...`, never here.
[vars]
MOCK = "0"
ALLOWED_ORIGIN = "https://domrugg44.github.io"
ODDS_DAILY_MAX = "12"
ODDS_MIN_REMAINING = "25"
