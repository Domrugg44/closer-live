name: Grade picks

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grade pending picks
        shell: pwsh
        run: ./tools/grade.ps1
      - name: Save results
        run: |
          if git diff --quiet -- data/record.json; then
            echo "Nothing new to grade"
            exit 0
          fi
          git config user.name "closer-grader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/record.json
          git commit -m "Grade picks $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
