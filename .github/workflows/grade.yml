name: Grade picks

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    # Windows PowerShell 5.1, the same engine used locally, so the log's hashes are computed identically
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the log before grading
        shell: powershell
        run: ./tools/verify-log.ps1
      - name: Grade pending picks
        shell: powershell
        run: ./tools/grade.ps1
      - name: Check nothing locked was changed
        shell: powershell
        run: ./tools/verify-log.ps1 -BaseRef HEAD
      - name: Save results
        shell: bash
        run: |
          if git diff --quiet -- data/record.json; then
            echo "Nothing new to grade"
            exit 0
          fi
          git config user.name "closer-grader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/record.json
          git commit -m "Grade picks $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
